name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'What to deploy: branch name, tag (v1.2.0), or commit SHA'
        required: true
        type: string
        default: main
      environment:
        description: 'Where to deploy'
        required: true
        type: choice
        options:
          - dev
          - qa
          - stage-ge
          - stage-am
          - stage-maxbet
          - prod-ge
          - prod-am
          - prod-maxbet

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      service-name: ${{ steps.config.outputs.service-name }}
      service-type: ${{ steps.config.outputs.service-type }}
      infra: ${{ steps.config.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - name: Read service config
        id: config
        run: |
          echo "service-name=$(yq '.service.name' .pipeline.yaml)" >> $GITHUB_OUTPUT
          echo "service-type=$(yq '.service.type' .pipeline.yaml)" >> $GITHUB_OUTPUT
          
          ENV_BASE=$(echo "${{ inputs.environment }}" | sed 's/-[a-z]*$//')
          INFRA=$(yq ".deploy.environments[] | select(.name == \"$ENV_BASE\") | .infra" .pipeline.yaml)
          echo "infra=$INFRA" >> $GITHUB_OUTPUT

  deploy:
    needs: resolve
    uses: kokajikia/ci-templates/.github/workflows/_deploy.yaml@main
    with:
      service-name: ${{ needs.resolve.outputs.service-name }}
      service-type: ${{ needs.resolve.outputs.service-type }}
      ref: ${{ inputs.ref }}
      environment: ${{ inputs.environment }}
      infra: ${{ needs.resolve.outputs.infra }}
    secrets: inherit
