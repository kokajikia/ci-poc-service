name: Deploy / Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g. v1.0.0, v0.9.5, or a commit SHA)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - stage-ge
          - stage-am
          - stage-maxbet
          - prod-ge
          - prod-am
          - prod-maxbet

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Read service config
        id: config
        shell: bash
        run: |
          SERVICE_NAME=$(yq '.service.name' .pipeline.yaml)
          SERVICE_TYPE=$(yq '.service.type' .pipeline.yaml)
          echo "service-name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          echo "service-type=$SERVICE_TYPE" >> $GITHUB_OUTPUT

      - name: Deploy ${{ steps.config.outputs.service-name }} ${{ inputs.tag }} to ${{ inputs.environment }}
        run: |
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║  MANUAL DEPLOY / ROLLBACK                              ║"
          echo "╠════════════════════════════════════════════════════════╣"
          echo "║  Service:     ${{ steps.config.outputs.service-name }}"
          echo "║  Version:     ${{ inputs.tag }}"
          echo "║  Environment: ${{ inputs.environment }}"
          echo "║  Triggered by: ${{ github.actor }}"
          echo "║  Image:       ghcr.io/${{ github.repository_owner }}/${{ steps.config.outputs.service-name }}:${{ inputs.tag }}"
          echo "╚════════════════════════════════════════════════════════╝"
          echo ""
          echo "→ [SIMULATED] Pulling image ghcr.io/${{ github.repository_owner }}/${{ steps.config.outputs.service-name }}:${{ inputs.tag }}"
          echo "→ [SIMULATED] Deploying to ${{ inputs.environment }}..."
          sleep 2
          echo "→ [SIMULATED] ✅ Successfully deployed version ${{ inputs.tag }} to ${{ inputs.environment }}"
