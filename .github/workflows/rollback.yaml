name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to roll back to (e.g. v1.0.0, v1.2.3)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - stage-ge
          - stage-am
          - stage-maxbet
          - prod-ge
          - prod-am
          - prod-maxbet

jobs:
  read-config:
    runs-on: ubuntu-latest
    outputs:
      service-name: ${{ steps.config.outputs.service-name }}
      service-type: ${{ steps.config.outputs.service-type }}
      infra: ${{ steps.resolve.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - name: Read config
        id: config
        run: |
          echo "service-name=$(yq '.service.name' .pipeline.yaml)" >> $GITHUB_OUTPUT
          echo "service-type=$(yq '.service.type' .pipeline.yaml)" >> $GITHUB_OUTPUT
      - name: Resolve infra from environment
        id: resolve
        run: |
          # Map environment back to its infra type from .pipeline.yaml
          ENV_BASE=$(echo "${{ inputs.environment }}" | sed 's/-[a-z]*$//')
          INFRA=$(yq ".deploy.targets[] | select(.name == \"$ENV_BASE\") | .infra" .pipeline.yaml)
          echo "infra=$INFRA" >> $GITHUB_OUTPUT

  rollback:
    needs: read-config
    uses: kokajikia/ci-templates/.github/workflows/_rollback.yaml@main
    with:
      service-name: ${{ needs.read-config.outputs.service-name }}
      service-type: ${{ needs.read-config.outputs.service-type }}
      tag: ${{ inputs.tag }}
      environment: ${{ inputs.environment }}
      infra: ${{ needs.read-config.outputs.infra }}
      triggered-by: ${{ github.actor }}
    secrets: inherit
