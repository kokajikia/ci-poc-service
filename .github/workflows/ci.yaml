name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  pipeline:
    uses: kokajikia/ci-templates/.github/workflows/pipeline.yaml@main
    with:
      config-path: .pipeline.yaml
    secrets: inherit
